<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hh35 | اختصارات Discord</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><span>حقوقي دس hh35.</span><nav><a href="{{ url_for('home') }}">الرئيسية</a><a href="{{ url_for('names') }}">مولد اليوزرات</a></nav></header><main class="wide"><div class="panel"><span class="mark">#</span><h1>مولد اختصارات Discord</h1><p>اضغط تشغيل لتوليد اقتراحات لاختصارات دعوات. هذه اقتراحات فقط وليست تأكيدًا للتوفر؛ لا يتم إرسال طلبات آلية إلى Discord.</p><div class="shortcut-controls"><label>طول الاختصار<select id="shortcutLength"><option value="2">ثنائي</option><option value="3">ثلاثي</option><option value="4" selected>رباعي</option><option value="5">خماسي</option></select></label><label>عدد الاقتراحات<select id="shortcutAmount"><option value="20">20</option><option value="40" selected>40</option><option value="80">80</option></select></label></div><div class="control-row"><button id="startButton" class="run-button" type="button">تشغيل</button><button id="stopButton" class="stop-button" type="button" disabled>إيقاف</button></div></div><div class="results-box"><h2>الاقتراحات</h2><div id="shortcutResults" class="names-grid"></div><small id="shortcutStatus">متوقف</small></div></main><script>const alphabet='abcdefghijklmnopqrstuvwxyz0123456789';let timer=null;const results=document.getElementById('shortcutResults'),status=document.getElementById('shortcutStatus'),start=document.getElementById('startButton'),stop=document.getElementById('stopButton');function make(){const n=Number(document.getElementById('shortcutLength').value),amount=Number(document.getElementById('shortcutAmount').value);results.innerHTML='';const set=new Set();while(set.size<amount){let s='';for(let i=0;i<n;i++)s+=alphabet[Math.floor(Math.random()*alphabet.length)];set.add(s)}for(const s of set){const b=document.createElement('button');b.className='name-chip';b.type='button';b.textContent='discord.gg/'+s;b.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(s);results.appendChild(b)}}function run(){if(timer)return;make();timer=setInterval(make,1200);start.disabled=true;stop.disabled=false;status.textContent='يعمل الآن — اضغط إيقاف لإيقاف التوليد'}function halt(){clearInterval(timer);timer=null;start.disabled=false;stop.disabled=true;status.textContent='تم الإيقاف'}start.onclick=run;stop.onclick=halt;</script></body></html>
