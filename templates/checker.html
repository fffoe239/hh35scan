<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hh35 | فحص اليوزرات والاختصارات</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><span>حقوقي دس hh35.</span><nav><a href="{{ url_for('home') }}">الرئيسية</a><a href="{{ url_for('names') }}">مولد اليوزرات</a></nav></header>
<main class="wide">
<div class="panel"><h1>فحص اليوزرات والاختصارات</h1><p>النتيجة تظهر هنا مباشرة بدون الانتقال لأعلى الصفحة.</p>
<form id="checkForm" method="post" class="checker-form"><select name="kind"><option value="invite">اختصار دعوة Discord</option><option value="username">يوزر Discord</option></select><input name="value" placeholder="hh35 أو zk8" required autocomplete="off"><button type="submit">فحص</button></form></div>
<div id="checkResult" class="results-box check-result" {% if not results %}hidden{% endif %}>{% if results %}{% set row=results[0] %}<h2>{{ row.status }}</h2><p>{{ row.detail }}</p>{% endif %}</div>
<div class="panel"><h2>توليد اقتراحات</h2><div class="length-buttons"><label class="length-option"><input type="radio" name="length" value="2"><span>ثنائي</span></label><label class="length-option"><input type="radio" name="length" value="3"><span>ثلاثي</span></label><label class="length-option"><input type="radio" name="length" value="4" checked><span>رباعي</span></label><label class="length-option"><input type="radio" name="length" value="5"><span>خماسي</span></label></div><div class="control-row"><button id="startButton" class="run-button" type="button">تشغيل</button><button id="stopButton" class="stop-button" type="button" disabled>إيقاف</button></div><p id="generatorStatus">متوقف</p><div id="generatedResults" class="names-grid"></div></div>
</main>
<script>
const form=document.getElementById('checkForm'), result=document.getElementById('checkResult');
form.addEventListener('submit',async event=>{event.preventDefault(); const button=form.querySelector('button'); button.disabled=true; button.textContent='يفحص...'; try{const response=await fetch(location.pathname,{method:'POST',body:new FormData(form),headers:{'X-Requested-With':'XMLHttpRequest'}}); const html=await response.text(); const doc=new DOMParser().parseFromString(html,'text/html'); const card=doc.querySelector('#checkResult'); result.innerHTML=card?card.innerHTML:'<h2>غير قابل للتأكيد</h2><p>تعذر إكمال الفحص.</p>'; result.hidden=false;}catch(e){result.innerHTML='<h2>غير قابل للتأكيد</h2><p>تعذر الوصول إلى الخدمة.</p>';result.hidden=false}finally{button.disabled=false;button.textContent='فحص'}});
const alphabet='abcdefghijklmnopqrstuvwxyz0123456789',box=document.getElementById('generatedResults'),state=document.getElementById('generatorStatus'),start=document.getElementById('startButton'),stop=document.getElementById('stopButton');let timer=null;
function generate(){const n=Number(document.querySelector('input[name="length"]:checked').value)+1,values=new Set();while(values.size<2){let core='';for(let i=0;i<n;i++)core+=alphabet[Math.floor(Math.random()*alphabet.length)];let value=core;if(Math.random()<.65){const p=Math.floor(Math.random()*(n-1))+1;value=core.slice(0,p)+'.'+core.slice(p)}values.add(value)}box.innerHTML=[...values].map(v=>`<button type="button" class="name-chip" onclick="navigator.clipboard&&navigator.clipboard.writeText('${v}')">${v}</button>`).join('')}
start.onclick=()=>{if(timer)return;generate();timer=setInterval(generate,1200);start.disabled=true;stop.disabled=false;state.textContent='يعمل الآن'};stop.onclick=()=>{clearInterval(timer);timer=null;start.disabled=false;stop.disabled=true;state.textContent='تم الإيقاف'};
</script></body></html>
