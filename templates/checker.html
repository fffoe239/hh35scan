<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>hh35 | فحص الاسم</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header>
      <span>حقوقي دس hh35.</span>
      <a href="{{ url_for('home') }}">الرئيسية</a>
    </header>
    <main class="wide">
      <div class="panel">
        <h1>فحص الاختصار</h1>
        <p>اكتب الاختصار فقط، مثل <code>hh35</code> — لا تحتاج إلى كتابة discord.gg/.</p>
        <form method="post" class="checker-form">
          <select name="kind">
            <option value="invite">اختصار دعوة Discord</option>
            <option value="username">اسم/اختصار في الأدلة</option>
          </select>
          <input name="value" placeholder="hh35" required>
          <button>فحص</button>
        </form>
      </div>
      {% if results %}
        <div class="results-box">
          <h2>النتائج</h2>
          <table>
            <thead>
              <tr>
                <th>المصدر</th>
                <th>الحالة</th>
                <th>التفاصيل</th>
              </tr>
            </thead>
            <tbody>
              {% for row in results %}
                <tr>
                  <td>{{ row.name }}</td>
                  <td class="status {{ 'used' if row.status == 'مستخدم' else 'safe' if row.status == 'غير موجود' else 'unknown' }}">{{ row.status }}</td>
                  <td>{{ row.detail }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% endif %}
    </main>
  </body>
</html>
